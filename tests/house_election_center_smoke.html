<!doctype html><html lang="en"><head><meta name="robots" content="noindex,follow">
<meta charset="utf-8"><title>National Election Center and House coverage regression</title></head>
<body><h1>Ervin election center browser regression</h1><pre id="report" data-status="RUNNING">Loading</pre>
<script>
(async()=>{
 const report=document.getElementById('report'),checks=[];
 const ok=(cond,desc)=>{if(!cond)throw Error(desc);checks.push(desc)};
 const frame=document.createElement('iframe');frame.title='Test dashboard';frame.style.cssText='width:980px;height:820px;border:0';document.body.append(frame);
 const load=async href=>{
  await new Promise((resolve,reject)=>{frame.onload=resolve;frame.onerror=()=>reject(Error('Could not load '+href));frame.src=href});
  return frame.contentDocument;
 };
 let stage='initial';
 const until=async pred=>{for(let n=0;n<180;n++){if(pred())return;await new Promise(r=>setTimeout(r,85))}
 const d=frame.contentDocument;
 throw Error('Timed out at '+stage+' on '+frame.src+'; page='+d?.title+'; cards='+d?.querySelectorAll('#houseCards .gov-card')?.length+'; houseCount='+d?.querySelector('#houseCount')?.textContent+'; status='+d?.querySelector('#houseCards,#houseModelSummary,#nationalCount')?.textContent?.slice(0,210))};
 try{
  localStorage.removeItem('ervin-model-watchlist-v2');
  stage='house-load';let d=await load('../house/');
  await until(()=>d.getElementById('houseCount')?.textContent.includes('districts'));
  // House board intentionally defaults to Michigan in the unified state-first navigation.
  // Switch to every state before checking the national 435-seat total.
  const allStates=d.getElementById('houseState');
  allStates.value='all';
  allStates.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));
  stage='house-all-435';await until(()=>d.querySelectorAll('#houseCards .gov-card').length===435);
  ok(d.querySelectorAll('#houseCards .gov-card').length===435,'All 435 House district cards are indexed');
  // The 435-card paint and its independent SVG map paint can settle on
  // different browser frames under visual-test contention. Require the
  // complete fifty-state geography, but wait for its actual render.
  stage='house-all-geographic-states';
  await until(()=>d.querySelectorAll('#houseMapSvg path[data-code]').length===50);
  ok(d.querySelectorAll('#houseMapSvg path[data-code]').length===50,'All House states rendered geographically');
  ok(d.getElementById('ratingsCount').textContent==='68','68 sourced House ratings are explicitly identified');
  ok(d.getElementById('houseModelSummary').textContent.includes('Numerical House scenarios')&&d.getElementById('houseModelSummary').textContent.includes('not calibrated win probabilities'),'House numerical margins use 2026 congressional boundaries with rebuilt-vote caveats');
  // Wait for the fully modeled cards after 435 placeholders initially appear.
  // An NBC/office results refresh may repaint during this browser checkpoint.
  stage='house-modeled-cards';
  await until(()=>d.querySelectorAll('#houseCards .gov-card').length===435&&!d.getElementById('houseCards').textContent.includes('No model loaded'));
  ok(!d.getElementById('houseCards').textContent.includes('No model loaded')&&d.querySelectorAll('#houseCards .gov-card').length===435,'All 435 House cards include provisional model ratings rather than blank placeholders');
  const search=d.getElementById('houseSearch');search.value='MI-04';search.dispatchEvent(new frame.contentWindow.Event('input',{bubbles:true}));
  ok(d.querySelectorAll('#houseCards .gov-card').length===1&&d.getElementById('houseCards').textContent.includes('Tossup'),'House search and Cook rating work');
  stage='house-MI';d=await load('../house/?state=MI');
  // Check the completed district-card paint, not an earlier counter update.
  stage='house-MI-rendered';await until(()=>d.querySelectorAll('#houseCards .gov-card').length===13);
  ok(d.getElementById('houseState').value==='MI'&&d.querySelectorAll('#houseCards .gov-card').length===13,'State links filter Michigan 13 House districts');
  stage='district-MI-04';d=await load('../elections/?office=house&state=MI&district=04');
  await until(()=>d.getElementById('raceTitle').textContent.includes('District 4'));
  ok(d.getElementById('raceTitle').textContent.includes('District 4'),'House race dossier resolves district query');
  ok(d.getElementById('leadValue').textContent==='Tossup','House rating is qualitative');
  ok(d.getElementById('pollIntro').textContent.includes('not an Ervin polling average')&&d.getElementById('pollRows').textContent.includes('GBAO'),'House survey is sourced and not presented as a fabricated average');
  ok(d.getElementById('mapTitle').textContent.includes('district or county reference geography')&&d.getElementById('qualifiers').textContent.includes('outside the district'),'Statewide county context clearly disclaims district boundaries');
  ok(/No confirmed|No verified|Official feed cannot be checked|unavailable|Unofficial|reported votes/i.test(d.getElementById('resultNotice').textContent)&&(!/^[\\d,]+$/.test(d.getElementById('votesReported').textContent.trim())||d.getElementById('resultNotice').textContent.toLowerCase().includes('unofficial')),'House election-night panel must not show fabricated totals before polls close');
  // The old Research Center is deliberately retired; it must forward to the State Desk.
  stage='legacy-redirect';d=await load('../elections/overview/');
  // The direct homepage browser_smoke separately verifies all fifty rendered
  // polygons. A retired redirect must only prove the canonical new location and
  // page shell; delayed network-fed map data must not block this smoke suite.
  await until(()=>frame.contentWindow.location.pathname.endsWith('/states/')&&/Every state|A Blue House|Election Night/.test(frame.contentDocument?.querySelector('h1.ed-headline')?.textContent||''));
  d=frame.contentDocument;
  ok(frame.contentWindow.location.pathname.endsWith('/states/'),'Legacy Research Center forwards to State Desk');
  ok(!!d.getElementById('usMap'),'Geographic states are accessible through the canonical State Desk');
  ok(d.getElementById('stateMapTooltip')!==null,'State hover ledger replaces legacy Research Center tabs');
  stage='election-night';d=await load('../election-night/');
  await until(()=>d.querySelector('#nationalCount')?.textContent.includes('506 indexed races'));
  ok(d.querySelectorAll('#raceList .race-row').length===506,'National Election Night covers all 435 House, 35 Senate and 36 governor races');
  stage='election-night-house-filter';const button=d.querySelector('button[data-office="House"]');button.click();
  await until(()=>d.querySelectorAll('#raceList .race-row').length===435);
  ok(d.querySelectorAll('#raceList .race-row').length===435,'Election Night House filtering shows all districts');
  report.dataset.status='PASS';report.textContent='PASS '+checks.length+' checks\n'+checks.map(x=>'✓ '+x).join('\n');
 }catch(err){report.dataset.status='FAIL';report.textContent='FAIL '+(err.stack||String(err))}
})();
</script></body></html>
