<!doctype html><html lang="en"><head><meta name="robots" content="noindex,follow"><meta charset="utf-8"><title>Post-midterm public State Desk browser acceptance</title></head>
<body><h1>Post-election editorial + archive acceptance</h1><pre id="report" data-status="RUNNING">Running…</pre>
<script>
(async()=>{
 const report=document.getElementById('report'),checks=[];
 const check=(v,msg)=>{if(!v)throw Error(msg);checks.push(msg)};
 const until=async(fn,what)=>{for(let i=0;i<240;i++){if(fn())return;await new Promise(r=>setTimeout(r,100))}throw Error('Timeout: '+what)};
 const frame=document.createElement('iframe');frame.title='Post-election homepage';frame.style.cssText='width:1180px;height:940px;border:0';
 document.body.append(frame);
 const navigate=src=>new Promise((resolve,reject)=>{frame.onload=resolve;frame.onerror=()=>reject(Error('Unable to open '+src));frame.src=src});
 try{
  await navigate('../states/');
  let d=frame.contentDocument,w=frame.contentWindow;const $=id=>frame.contentDocument.getElementById(id);
  await until(()=>$('postElectionDesk')&&Number(($('postReported')?.textContent||'').replaceAll(',',''))>100,'2026 sourced post-election count');
  check(d.querySelector('#postElectionDesk h1')?.textContent.includes('A national wave'),'Results-first editorial headline present');
  check(d.querySelectorAll('#postAnalysis .post-article-card').length===9,'Nine original reports linked from newsroom homepage');
  check(d.querySelectorAll('.post-package-card').length===3,'Texas Kansas South Carolina feature package appears on front page');
  check(w.getComputedStyle($('edSimulationPanel')).display==='none','Historical prediction map is hidden on news homepage');
  check(!$('postModelAudit')&&!d.body.textContent.includes('Forecast scorecard'),'No model accuracy scorecard on results homepage');
  check($('postCalled')?.textContent!=='—','Attributed AP call count is available');
  check($('watchSection')?.hidden===false&&w.getComputedStyle($('watchSection')).display==='none','Pre-election watch carousel is archived, not shown');
  check($('balanceOfPower')&&w.getComputedStyle($('balanceOfPower')).display==='none','Forecast seat projections no longer compete with reported control');
  check(d.querySelectorAll('.pe-global-nav a').length===9,'Nine-section editorial navigation installed');
  check(d.querySelectorAll('#usMap path.ed-state').length===50,'All fifty state SVG shapes available');
  check($('postCloseRaces')&&$('postCloseList'),'Outstanding-count section exists');
  const senate=d.querySelector('[data-post-office="senate"]');senate.click();
  check(senate.getAttribute('aria-pressed')==='true','Senate close-count office filter works');
  const all=d.querySelector('[data-post-office="all"]');all.click();
  check(all.getAttribute('aria-pressed')==='true','Close-count filter can reset');
  const theme=$('themeToggle'),dark=d.documentElement.classList.contains('theme-dark');theme.click();
  check(d.documentElement.classList.contains('theme-dark')!==dark,'Light/dark appearance switch works');
  theme.click();
  frame.style.width='390px';await new Promise(resolve=>w.requestAnimationFrame(resolve));
  check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+5,'Results homepage has no phone-width horizontal overflow');
  await navigate('../states/?view=final');d=frame.contentDocument;w=frame.contentWindow;
  await until(()=>d.querySelector('#edFinalHeadline')&&d.querySelectorAll('#edSimTabs button').length===3,'locked forecast archive');
  check(!d.querySelector('#postElectionDesk'),'Archive stays separate from election reporting');
  check(d.querySelector('#edFinalHeadline')?.textContent.includes('FINAL'),'Original final forecast remains accessible');
  await navigate('../analysis/senate-seven-flips/');d=frame.contentDocument;w=frame.contentWindow;
  await until(()=>d.querySelectorAll('.story-table tbody tr').length===7,'senate story AP-attributed source table');
  check(d.querySelector('h1')?.textContent.includes('Seven Senate flips'),'Story detail page loads');
  check(d.querySelectorAll('.story-sources a').length>=2,'Article cites independent external election reporting');
  check(d.querySelectorAll('.pe-global-nav a').length===9,'Articles share the same nav as national site');
  await navigate('../analysis/texas-new-era/');d=frame.contentDocument;
  check(d.querySelector('h1')?.textContent.includes('Talarico'),'New Texas feature is linked and readable');
  await navigate('../analysis/kansas-hamilton-upset/');d=frame.contentDocument;
  check(d.querySelector('h1')?.textContent.includes('Kansas'),'New Kansas feature is readable');
  await navigate('../analysis/south-carolina-andrews/');d=frame.contentDocument;
  check(d.querySelector('h1')?.textContent.includes('Annie Andrews'),'New South Carolina feature is readable');
  await navigate('../analysis/three-state-election-margins/');d=frame.contentDocument;
  check(d.querySelectorAll('.story-table tbody tr').length===3,'New three-state data analysis compares three contests');
  await navigate('../archive/');d=frame.contentDocument;
  check(d.querySelectorAll('.archive-grid a').length===4,'Historic forecast archive preserves four paths');
  await navigate('../results/');d=frame.contentDocument;w=frame.contentWindow;
  await until(()=>Number((d.querySelector('#prAllCount')?.textContent||'').replaceAll(',',''))>100&&d.querySelectorAll('.pr-race').length>15,'AP-led results reader and call ledger');
  check(d.querySelectorAll('.pr-snapshot-card').length===7,'Seven Senate AP-attributed vote snapshots display, excluding governor snapshot records');
  check(d.querySelectorAll('a[href*="apnews.com/projects/elections-2026/"]').length>=3,'Results desk links directly to original AP election pages');
  check(!d.body.textContent.includes('CivicAPI'),'AP-led results page contains no CivicAPI provider interface');
  check(d.querySelectorAll('.pe-global-nav a[href$="/results/"]').length===1,'Results navigation points to the replacement AP-led desk');
  d.querySelector('#prOffice').value='senate';d.querySelector('#prOffice').dispatchEvent(new Event('change'));
  check(d.querySelector('#prCallNotice')?.textContent.includes('locally documented AP'),'Office filter continues to show sourced race calls');
  await navigate('../analysis/polls-underestimated-democrats/');d=frame.contentDocument;w=frame.contentWindow;
  check(d.querySelectorAll('.story-table tbody tr').length===7,'Polling feature compares seven sourced Senate races');
  check(d.querySelector('h1')?.textContent.includes('polls missed'),'Longform polling feature is available');
  check(d.querySelector('.story-hero-photo img')?.getAttribute('src')?.includes('commons.wikimedia.org'),'Feature photo comes from Wikimedia Commons');
  report.dataset.status='PASS';report.textContent='PASS '+checks.length+' checks\n'+checks.join('\n');
 }catch(err){report.dataset.status='FAIL';report.textContent='FAIL: '+err.stack}
})();
</script></body></html>
