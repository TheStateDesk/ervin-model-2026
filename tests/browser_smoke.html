<!doctype html><html lang="en"><head><meta name="robots" content="noindex,follow"><meta charset="utf-8"><title>State Desk public homepage browser smoke</title></head>
<body><h1>State Desk public homepage browser acceptance</h1><pre id="report" data-status="RUNNING">Running…</pre>
<script>
(async()=>{
 const report=document.getElementById('report'),checks=[];
 const check=(v,msg)=>{if(!v)throw Error(msg);checks.push(msg)};
 const frame=document.createElement('iframe');frame.title='The State Desk homepage';frame.style.cssText='width:1180px;height:940px;border:0';
 const load=new Promise((res,rej)=>{frame.onload=res;frame.onerror=()=>rej(Error('State Desk unavailable'))});
 frame.src='../states/';document.body.appendChild(frame);
 try{
  await load;const d=frame.contentDocument,w=frame.contentWindow,$=id=>d.getElementById(id);
  const until=async fn=>{for(let i=0;i<180;i++){if(fn())return;await new Promise(r=>setTimeout(r,100))}throw Error('Timeout waiting for State Desk models')};
  await until(()=>$('powerCards')?.dataset.powerReady==='true'&&$('watchCards')?.querySelectorAll('.watch-card').length>=4&&$('usMap')?.querySelector('path.ed-state'));
  const heading=d.querySelector('h1.ed-headline')?.textContent||'';
  check(/Every state|A Blue House|Election Night/.test(heading),'The 50-state editorial State Desk headline must show either the preview, locked forecast, or election-night phase: '+heading);
  check($('watchSection')&&$('balanceOfPower')&&$('nationMap')&&$('electionDashboard'),'Races to watch, office balance, atlas and automatic election-night dashboard are present');
  check(!d.querySelector('#electionNationalMap,#electionLocalMap'),'Live and forecast maps must not duplicate national/state SVGs');
  check($('watchSection').getBoundingClientRect().top<$('balanceOfPower').getBoundingClientRect().top,'Races to watch precede office balance');
  const nightActive=Date.now()>=Date.parse('2026-11-03T17:55:00-05:00');
  check(nightActive?$('edNightMapSlot')?.contains($('nationMap')):$('balanceOfPower').getBoundingClientRect().top<$('nationMap').getBoundingClientRect().top,'Pre-election atlas follows balance, or during election night appears prominently in the national results desk');
  check($('powerCards').querySelectorAll('.power-card').length===3,'Three office forecast cards render');
  check(d.querySelectorAll('#usMap path.ed-state').length>=50,'All fifty state shapes accessible');
  check(!d.querySelector('#researchLab,#advancedPollingDrawer,#forecast-settings,#races'),'Retired workbench does not appear');
  check(!d.querySelector('a[href="../"]'),'Homepage does not link back to retired root');
  const first=$('watchCards').querySelector('.watch-card__name').textContent;
  $('watchNext').click();check($('watchCards').querySelector('.watch-card__name').textContent!==first,'Races to watch carousel advances');
  $('watchPrev').click();check($('watchCards').querySelector('.watch-card__name').textContent===first,'Races to watch carousel reverses');
  check(d.querySelectorAll('[data-map-office]').length===3&&d.querySelectorAll('[data-national-county-view]').length===3,'Senate governor and House office buttons, with one forecast/report county map available');
  const wasDark=d.documentElement.classList.contains('theme-dark');
  $('themeToggle').click();check(d.documentElement.classList.contains('theme-dark')!==wasDark,'Appearance toggle switches contrast theme');
  $('themeToggle').click();check(d.documentElement.classList.contains('theme-dark')===wasDark,'Appearance toggle switches back');
  frame.style.width='390px';await new Promise(res=>w.requestAnimationFrame(res));
  check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+5,'No phone horizontal overflow');
  report.dataset.status='PASS';report.textContent='PASS '+checks.length+' checks\n'+checks.join('\n');
 }catch(err){report.dataset.status='FAIL';report.textContent='FAIL: '+err.stack}
})();
</script></body></html>
