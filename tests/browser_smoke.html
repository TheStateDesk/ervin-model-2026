<!DOCTYPE html><html lang="en"><head><meta name="robots" content="noindex,follow"><meta charset="utf-8"><title>Ervin public homepage smoke test</title></head>
<body><h1>Public homepage browser smoke</h1><pre id="report" data-status="RUNNING">Checking…</pre>
<script>
(async()=>{
 const report=document.getElementById('report'),checks=[];
 const check=(v,msg)=>{if(!v)throw Error(msg);checks.push(msg)};
 const iframe=document.createElement('iframe');iframe.title='Ervin 2026 public homepage';iframe.style.cssText='width:1180px;height:940px;border:0';
 const wait=new Promise((res,rej)=>{iframe.onload=res;iframe.onerror=()=>rej(Error('Homepage unavailable'))});
 iframe.src='../index.html';document.body.appendChild(iframe);
 try{
  await wait;
  const d=iframe.contentDocument,w=iframe.contentWindow,$=id=>d.getElementById(id);
  const until=async fn=>{for(let i=0;i<160;i++){if(fn())return;await new Promise(r=>setTimeout(r,100))}throw Error('Timed out waiting for homepage model')};
  await until(()=>$('powerCards')?.dataset.powerReady==='true'&&$('controlDemChance')?.textContent.endsWith('%'));
  check($('frontTitle')?.textContent.includes('national picture'),'New editorial home is visible');
  check($('senate-control')&&$('balanceOfPower'),'Both core models appear');
  check($('senate-control').getBoundingClientRect().top<$('balanceOfPower').getBoundingClientRect().top,'Senate control precedes office seat totals');
  check(Number.parseInt($('controlDemChance').textContent)>=0,'Democratic-aligned control displays scenario frequency');
  check(Number.parseInt($('controlRepChance').textContent)>=0,'Republican control displays scenario frequency');
  check(Math.abs([...$('controlBar').children].reduce((a,n)=>a+Number.parseFloat(n.style.width),0)-100)<.03,'Probability bar adds to 100%');
  check($('powerCards').querySelectorAll('.power-card').length===3,'House Senate Governors seat forecasts render');
  check(d.querySelectorAll('#topNavigation a').length===4,'Front-facing header has only four core destinations');
  check(d.querySelectorAll('#globalMenuPanel .global-menu-group').length===3,'Compact 3-group public navigation works');
  check(!d.querySelector('#researchLab,#advancedPollingDrawer,#forecast-settings,#races,#tabs,#map-area'),'Retired public research dashboard is removed');
  check(!d.querySelector('a[href*="#races"],a[href*="#tabs"],a[href*="researchLab"]'),'No links to retired model UI');
  $('controlUncertainty').value='1.3';$('controlUncertainty').dispatchEvent(new w.Event('change',{bubbles:true}));
  check($('controlStatus').textContent.includes('14,000'),'Sensitivity selector recalculates simulation');
  $('controlUncertainty').value='1';$('controlUncertainty').dispatchEvent(new w.Event('change',{bubbles:true}));
  check($('controlDemChance').textContent.endsWith('%'),'Reset restores model result');
  const t=$('themeToggle');if(t){t.click();check(!d.documentElement.classList.contains('light'),'Dark appearance works');t.click();check(d.documentElement.classList.contains('light'),'Light appearance works')}
  iframe.style.width='390px';await new Promise(r=>w.requestAnimationFrame(r));
  check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+5,'No horizontal overflow at phone width');
  report.dataset.status='PASS';report.textContent='PASS '+checks.length+' checks\n'+checks.join('\n');
 }catch(e){report.dataset.status='FAIL';report.textContent='FAIL: '+e.stack}
})();
</script></body></html>
