<!doctype html><html lang="en"><head><meta name="robots" content="noindex,follow"><meta charset="utf-8"><title>State Desk public homepage browser smoke</title></head>
<body><h1>State Desk public homepage browser acceptance</h1><pre id="report" data-status="RUNNING">Running…</pre>
<script>
(async()=>{
 const report=document.getElementById('report'),checks=[];
 const check=(v,msg)=>{if(!v)throw Error(msg);checks.push(msg)};
 const frame=document.createElement('iframe');frame.title='The State Desk homepage';frame.style.cssText='width:1180px;height:940px;border:0';
 const load=new Promise((res,rej)=>{frame.onload=res;frame.onerror=()=>rej(Error('State Desk unavailable'))});
 frame.src='../states/';document.body.appendChild(frame);
 try{
  await load;const d=frame.contentDocument,w=frame.contentWindow,$=id=>d.getElementById(id);
  const until=async fn=>{for(let i=0;i<180;i++){if(fn())return;await new Promise(r=>setTimeout(r,100))}throw Error('Timeout waiting for State Desk models')};
  await until(()=>$('powerCards')?.dataset.powerReady==='true'&&$('controlDemChance')?.textContent.endsWith('%')&&$('usMap')?.querySelector('path.ed-state'));
  check(d.querySelector('h1.ed-headline')?.textContent.includes('Every state'),'The 50-state editorial State Desk remains homepage');
  check($('senate-control')&&$('balanceOfPower')&&$('nationMap'),'Control, office balance, and atlas are present');
  check($('senate-control').getBoundingClientRect().top<$('balanceOfPower').getBoundingClientRect().top,'Senate control precedes office balance');
  check($('balanceOfPower').getBoundingClientRect().top<$('nationMap').getBoundingClientRect().top,'Three office balance forecasts precede map');
  check($('controlDemChance').textContent.endsWith('%')&&$('controlRepChance').textContent.endsWith('%'),'Control probabilities are generated');
  check(Math.abs([...$('controlBar').children].reduce((a,n)=>a+parseFloat(n.style.width||0),0)-100)<.03,'Scenario probabilities sum to 100%');
  check($('powerCards').querySelectorAll('.power-card').length===3,'Three office cards render');
  check(d.querySelectorAll('#usMap path.ed-state').length>=50,'All 50 state shapes accessible');
  check(!d.querySelector('#researchLab,#advancedPollingDrawer,#forecast-settings,#races'),'Retired workbench does not appear');
  check(!d.querySelector('a[href="../"]'),'State Desk does not link back to retired root');
  $('controlUncertainty').value='1.3';$('controlUncertainty').dispatchEvent(new w.Event('change',{bubbles:true}));
  check($('controlStatus').textContent.includes('14,000'),'Sensitivity selector runs simulation');
  $('controlUncertainty').value='1';$('controlUncertainty').dispatchEvent(new w.Event('change',{bubbles:true}));
  check($('controlDemChance').textContent.endsWith('%'),'Scenario can reset');
  $('themeToggle').click();check(d.documentElement.classList.contains('theme-dark'),'State Desk dark mode works');
  $('themeToggle').click();check(!d.documentElement.classList.contains('theme-dark'),'State Desk light mode works');
  frame.style.width='390px';await new Promise(res=>w.requestAnimationFrame(res));
  check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+5,'No phone horizontal overflow');
  report.dataset.status='PASS';report.textContent='PASS '+checks.length+' checks\n'+checks.join('\n');
 }catch(err){report.dataset.status='FAIL';report.textContent='FAIL: '+err.stack}
})();
</script></body></html>
