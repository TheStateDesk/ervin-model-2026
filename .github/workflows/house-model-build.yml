name: Build sourced Ervin House model (feature branch only)
on:
  push:
    branches: ['feature/ervin-house-435-20261102']
    paths:
      - 'scripts/build-house-ervin.py'
      - '.github/workflows/house-model-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ervin-house-435-20261102
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install page HTML parser
        run: python -m pip install beautifulsoup4
      - name: Build all 435 model rows from source data
        run: python scripts/build-house-ervin.py
      - name: Check source coverage and forecast schema
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          j=json.load(open('house/ervin-forecast-2026-11-02.json'))
          assert len(j['races'])==435
          assert sum(j['summary']['ratings'].values())==435
          assert j['summary']['districtsWithPollRows']>=105
          assert j['summary']['districtsWithComparablePolls']>=95
          for key,r in j['races'].items():
            assert r['id']==key and r['modelRating'] and -50<=r['marginD']<=50
            assert isinstance(r['surveys'],list)
          print('HOUSE ALL-435 DATA QA PASS',j['summary'])
          PY
      - name: Persist generated data to unpublished feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add house/ervin-forecast-2026-11-02.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate sourced 435-district Ervin House model data"
            git push origin HEAD:feature/ervin-house-435-20261102
          fi
