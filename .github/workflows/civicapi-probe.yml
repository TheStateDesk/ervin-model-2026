name: CivicAPI primary election-results collector
on:
  push:
    branches: [main]
    paths:
      - 'scripts/civicapi_national.py'
      - 'tests/test_civicapi_national.py'
      - '.github/workflows/civicapi-probe.yml'
  schedule:
    - cron: '37 2,8,14,20 * * *'
    - cron: '*/10 0-9 4 11 *'
    - cron: '*/10 23 3 11 *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: civicapi-2026-results
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate national results parser (offline test fixtures)
        run: python3 -m unittest discover -s tests -p test_civicapi_national.py -v
      - name: Discover all races and fetch v2 results after race poll close
        run: python3 scripts/civicapi_national.py
      - name: Validate published snapshots and browser parser
        run: |
          python3 -m json.tool civicapi/races.json >/dev/null
          python3 -m json.tool civicapi/registry.json >/dev/null
          python3 -m json.tool civicapi/discovery.json >/dev/null
          node --check election-night/returns-core.js
          node scripts/test-live-results-stress.mjs
      - name: Commit validated race roster and reporting snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git reset --hard origin/main
            python3 scripts/civicapi_national.py
          fi
          git add civicapi/registry.json civicapi/races.json civicapi/discovery.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh CivicAPI v2 national race registry and results"
            git pull --rebase origin main
            git push
            # GitHub suppresses push-triggered workflows from the default
            # GITHUB_TOKEN. Explicit workflow_dispatch is permitted and
            # guarantees a Pages refresh for genuine new vote or race records.
            # A status-only discovery.json timestamp need not redeploy the site.
            if git diff --name-only HEAD^ HEAD | grep -Eq '^civicapi/(races|registry)\.json
; then
              gh workflow run deploy-pages.yml --ref main
              echo "Started Pages publish for updated validated election results"
            fi
          fi
      # The collector has no browser-side credentials. New accepted totals
      # publish through the regular Pages workflow and its visual checks.
