name: CivicAPI primary election-results collector
on:
  push:
    branches: [main]
    paths:
      - 'scripts/civicapi_national.py'
      - 'election-night/nbc-calls.json'
      - 'scripts/nbc-calls.js'
      - 'scripts/validate_nbc_calls.py'
      - 'tests/test_civicapi_national.py'
      - 'scripts/test-live-results-stress.mjs'
      - '.github/workflows/civicapi-probe.yml'
  schedule:
    # Retain the original low-frequency maintenance collection.
    - cron: '37 2,8,14,20 * * *'
    # One-time: every ten minutes through Nov. 5, 2026 at noon EST
    # (17:00 UTC); GitHub Actions cron timestamps are UTC.
    - cron: '*/10 8-23 4 11 *'
    - cron: '*/10 0-16 5 11 *'
    - cron: '0 17 5 11 *'
    # Post-election follow-through: hourly through November 11, 2026.
    - cron: '17 18-23 5 11 *'
    - cron: '17 * 6-11 11 *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: civicapi-2026-results
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Guard one-time ten-minute election-results schedule
        id: cadence
        shell: bash
        env:
          REQUESTED_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          # Manual and code-triggered runs remain available at all times.
          # Normal four-times-daily maintenance stays unchanged.
          if [[ "$GITHUB_EVENT_NAME" != "schedule" || "$REQUESTED_CRON" == "37 2,8,14,20 * * *" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Hourly post-election source checking continues after the earlier ten-minute cutoff.
          if [[ "$REQUESTED_CRON" == "17 18-23 5 11 *" || "$REQUESTED_CRON" == "17 * 6-11 11 *" ]]; then
            now=$(date -u +%s)
            start=$(date -u -d "2026-11-05T18:00:00Z" +%s)
            end=$(date -u -d "2026-11-12T00:00:00Z" +%s)
            if (( now >= start && now < end )); then
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "Hourly post-election results collection is active"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Hourly post-election collection is outside its 2026 window"
            fi
            exit 0
          fi
          # These date-specific cron expressions recur annually. Disable
          # the temporary high-frequency schedule after its 2026 cutoff.
          now=$(date -u +%s)
          begin=$(date -u -d "2026-11-04T07:50:00Z" +%s)
          # One final noon ET slot; up to ten minutes of Actions queue delay.
          cutoff=$(date -u -d "2026-11-05T17:10:00Z" +%s)
          if (( now >= begin && now < cutoff )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Ten-minute election-results collection is active"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "One-time election-night ten-minute window has expired; skipping"
          fi
      - uses: actions/checkout@v4
        if: steps.cadence.outputs.run == 'true'
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        if: steps.cadence.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Validate national results parser (offline test fixtures)
        if: steps.cadence.outputs.run == 'true'
        run: python3 -m unittest discover -s tests -p test_civicapi_national.py -v
      - name: Validate independent NBC projected winner citations
        if: steps.cadence.outputs.run == 'true'
        run: python3 scripts/validate_nbc_calls.py
      - name: Discover all races and fetch v2 results after race poll close
        if: steps.cadence.outputs.run == 'true'
        run: python3 scripts/civicapi_national.py
      - name: Validate published snapshots and browser parser
        if: steps.cadence.outputs.run == 'true'
        run: |
          python3 -m json.tool civicapi/races.json >/dev/null
          python3 -m json.tool civicapi/registry.json >/dev/null
          python3 -m json.tool civicapi/discovery.json >/dev/null
          node --check election-night/returns-core.js
          node scripts/test-live-results-stress.mjs
      - name: Commit validated race roster and reporting snapshots
        if: steps.cadence.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git reset --hard origin/main
            python3 scripts/civicapi_national.py
          fi
          git add civicapi/registry.json civicapi/races.json civicapi/discovery.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh CivicAPI v2 national race registry and results"
            git pull --rebase origin main
            git push
            # GitHub suppresses push-triggered workflows from the default
            # GITHUB_TOKEN. Explicit workflow_dispatch is permitted and
            # guarantees a Pages refresh for genuine new vote or race records.
            # Publish health updates, too, so readers see live 502 errors or stale
            # collection times even when no vote tally passes validation.
            if git diff --name-only HEAD^ HEAD | grep -Eq '^civicapi/(races|registry|discovery)[.]json'; then
              gh workflow run deploy-pages.yml --ref main
              echo "Started Pages publish for updated validated election results"
            fi
          fi
      # The collector has no browser-side credentials. New accepted totals
      # publish through the regular Pages workflow and its visual checks.
