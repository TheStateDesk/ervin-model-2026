name: Refresh watched county election returns
on:
  push:
    branches: [main]
    paths:
      - 'counties-watch/imports/**'
      - 'michigan/election-night/county_totals.json'
      - 'michigan/election-night/county_auto.json'
      - 'scripts/refresh_counties_watch.py'
      - 'tests/test_counties_watch.py'
      - 'counties-watch/history.json'
      - '.github/workflows/refresh-counties-watch.yml'
  schedule:
    # Sources are imported only on election days or when new validated CSVs arrive.
    # A scheduled check with no changed data never creates a commit.
    - cron: '*/10 * 3-5 11 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: county-watch-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Run county-source validations
        run: python -m unittest discover -s tests -p 'test_counties_watch.py' -v
      - name: Build attributed county return snapshot
        run: python scripts/refresh_counties_watch.py
      - name: Publish strictly validated new data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              git reset --hard origin/main
              python scripts/refresh_counties_watch.py
            fi
            git add counties-watch/results.json
            if git diff --cached --quiet; then
              echo "No new verified watched-county votes"
              break
            fi
            git commit -m "Refresh verified 2026 Senate county results"
            if git push origin HEAD:main; then
              echo "County result snapshot published to main"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Could not publish revised snapshot" >&2
              exit 1
            fi
          done
      # The one shared Pages workflow deploys main automatically.
