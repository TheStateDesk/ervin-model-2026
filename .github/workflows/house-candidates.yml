name: Audit 2026 House nominee source
on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_house_source.py'
      - '.github/workflows/house-candidates.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public candidate CSV schema
        run: python3 scripts/inspect_house_source.py
