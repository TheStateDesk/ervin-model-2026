name: Website integrity
on:
  push:
    branches: [main]
    paths:
      - 'geo/**'
      - 'scripts/**'
      - 'house/**'
      - 'elections/**'
      - 'governors/**'
      - 'states/**'
      - 'state/**'
      - 'index.html'
      - 'site-chrome.js'
      - 'polling/**'
      - '.github/workflows/website-integrity.yml'
  pull_request:
    paths:
      - 'geo/**'
      - 'scripts/**'
      - 'house/**'
      - 'elections/**'
      - 'governors/**'
      - 'states/**'
      - 'state/**'
      - 'index.html'
      - 'site-chrome.js'
jobs:
  integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect recent live Pages deployments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pages-release-diagnostic.mjs
      - run: node scripts/validate-election-site.mjs
      - run: node scripts/validate-state-desk.mjs
      - name: Install browser for visual verification
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render county maps and capture screenshots (desktop/mobile, light/dark)
        run: node scripts/visual-smoke.mjs
      - name: Audit currently published site and capture live screenshots
        if: always()
        run: node scripts/live-site-audit.mjs || true
      - name: Preserve visual screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: county-visual-verification
          path: visual-checks/
          retention-days: 7
