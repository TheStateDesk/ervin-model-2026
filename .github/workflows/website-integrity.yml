name: Website integrity
on:
  push:
    branches: [main]
    paths:
      - 'geo/**'
      - 'scripts/**'
      - 'house/**'
      - 'elections/**'
      - 'governors/**'
      - 'election-night/**'
      - 'states/**'
      - 'state/**'
      - 'stats-for-nerds/**'
      - 'index.html'
      - 'site-chrome.js'
      - 'polling/**'
      - '.github/workflows/website-integrity.yml'
  pull_request:
    paths:
      - 'geo/**'
      - 'scripts/**'
      - 'house/**'
      - 'elections/**'
      - 'governors/**'
      - 'states/**'
      - 'state/**'
      - 'stats-for-nerds/**'
      - 'index.html'
      - 'site-chrome.js'
jobs:
  integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-election-site.mjs
      - run: node scripts/audit-internal-links.mjs
      - run: node scripts/validate-state-desk.mjs
      - run: node scripts/validate-house-forecast.mjs
      - run: node scripts/validate-house-model.mjs
      - run: node scripts/validate-statewide-night.mjs
      - run: node scripts/validate-forecast-backtests.mjs
      - run: node scripts/test-election-night-balance.mjs
      - run: node scripts/test-early-signal-lab.mjs
      - run: node scripts/test-435-house-candidates.mjs
      - run: node scripts/test-michigan-candidate-effect.mjs
      - name: Install browser for visual verification
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render county maps and capture screenshots (desktop/mobile, light/dark)
        run: node scripts/visual-smoke.mjs
      - name: Verify live Pages waits for loaded Texas publisher averages
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/house-live-polling-async-check-20261102'
        run: node scripts/verify-live-publication.mjs
      - name: Audit currently published site and capture live screenshots
        if: always()
        run: node scripts/live-site-audit.mjs || true
      - name: Preserve visual screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: county-visual-verification
          path: visual-checks/
          retention-days: 7

