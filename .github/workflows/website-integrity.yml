name: Website integrity
on:
  push:
    branches: [main]
    paths:
      - 'geo/**'
      - 'scripts/**'
      - 'house/**'
      - 'elections/**'
      - 'governors/**'
      - 'states/**'
      - 'state/**'
      - 'index.html'
      - 'site-chrome.js'
      - 'polling/**'
      - '.github/workflows/website-integrity.yml'
  pull_request:
    paths:
      - 'geo/**'
      - 'scripts/**'
      - 'house/**'
      - 'elections/**'
      - 'governors/**'
      - 'states/**'
      - 'state/**'
      - 'index.html'
      - 'site-chrome.js'
jobs:
  integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-election-site.mjs
      - run: node scripts/validate-state-desk.mjs
      - run: node scripts/validate-house-model.mjs
      - name: Install browser for visual verification
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render county maps and capture screenshots (desktop/mobile, light/dark)
        run: node scripts/visual-smoke.mjs
      - name: Audit currently published site and capture live screenshots
        if: always()
        run: node scripts/live-site-audit.mjs || true
      - name: Preserve visual screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: county-visual-verification
          path: visual-checks/
          retention-days: 7

  assemble-house-feature:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/ervin-house-435-20261102'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ervin-house-435-20261102
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Build all 435 House forecasts with source validation
        run: python scripts/build-house-ervin.py
      - name: Validate and commit model JSON to isolated feature branch
        run: |
          python - <<'PY'
          import json
          r=json.load(open('house/ervin-forecast-2026-11-02.json'))
          assert len(r['races'])==435
          q=json.load(open('house/poll-questions-2026-11-02.json'))
          assert q['summary']['pollQuestionRows']>=400 and q['summary']['districts']>=100
          print('FORECAST VALIDATION',r['summary'],'POLL QUESTIONS',q['summary'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add house/ervin-forecast-2026-11-02.json house/poll-questions-2026-11-02.json
          if ! git diff --cached --quiet; then git commit -m 'Generate House forecast inputs'; git fetch origin feature/ervin-house-435-20261102; git rebase origin/feature/ervin-house-435-20261102; git push origin HEAD:feature/ervin-house-435-20261102; fi
