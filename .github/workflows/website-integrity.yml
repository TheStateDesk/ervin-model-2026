name: News website integrity
on:
  push:
    branches: [main]
  pull_request:
jobs:
  integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate public pages, links, assets and feeds
        run: |
          python3 scripts/build-news-public.py
          python3 tests/newsroom_publication_audit.py
