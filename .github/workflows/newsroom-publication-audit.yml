name: Newsroom publication and live-page audit
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'
permissions:
  contents: read
jobs:
  newsroom-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit current publication and deployed files
        run: |
          python3 scripts/build-news-public.py
          python3 tests/newsroom_publication_audit.py --live
