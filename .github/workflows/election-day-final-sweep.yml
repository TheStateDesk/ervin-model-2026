name: Election Day final forecasts and publisher source sweep
on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. Nov 3 2026 is on Eastern Standard Time.
    - cron: '35 14 3 11 *'  # 09:35 EST
    - cron: '43 16 3 11 *'  # 11:43 EST: comprehensive final sweep
    - cron: '5 17 3 11 *'   # 12:05 EST: final predictions update
    - cron: '24 19 3 11 *'  # 14:24 EST: late publisher changes before votes
permissions:
  contents: write
concurrency:
  group: final-sweep-2026
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parsing libraries
        run: python3 -m pip install beautifulsoup4
      - name: Verify strict governor source parser
        run: python3 -m unittest discover -s tests -p test_refresh_governors.py -v
      - name: Fetch and validate all available 2026 Senate publisher aggregates
        run: python3 scripts/refresh_polling.py
      - name: Refresh candidate-matched gubernatorial averages
        run: python3 scripts/refresh_governors.py
      - name: Refresh the 435-district House model with current public surveys
        run: python3 scripts/build-house-ervin.py
      - name: Update Senate forecast county baselines
        run: python3 scripts/build_county_watch_forecast.py
      - name: Reject structurally incomplete updated forecasts
        run: |
          python3 scripts/validate_data.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('house/ervin-forecast-2026-11-02.json').read_text())
          g=json.loads(Path('governors/data.json').read_text())
          s=json.loads(Path('counties-watch/forecast-baselines.json').read_text())
          assert len(h['races']) == 435 and len(g['races']) == 36 and len(s['states']) == 17
          assert all('marginD' in r for r in h['races'].values())
          print('Verified 435 House + 36 governor + 17 Senate forecasts')
          PY
      - name: Publish only source-linked model changes with latest main revision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governors/data.json polling/governor_refresh_log.json house/ervin-forecast-2026-11-02.json house/poll-questions-2026-11-02.json house/research-polls.json counties-watch/forecast-baselines.json research/senate-workbench-data.json source_snapshot.csv refresh_log.json recent_polls.json
          if git diff --staged --quiet; then
            echo 'No verified new polling or modeled forecast changes.'
            exit 0
          fi
          git commit -m 'Election Day verified publisher polling sweep and final forecast'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              echo 'Concurrent source update: restore latest main and rerun full evidence checks'
              git reset --hard origin/main
              python3 scripts/refresh_polling.py
              python3 scripts/refresh_governors.py
              python3 scripts/build-house-ervin.py
              python3 scripts/build_county_watch_forecast.py
              python3 scripts/validate_data.py
              git add governors/data.json polling/governor_refresh_log.json house/ervin-forecast-2026-11-02.json house/poll-questions-2026-11-02.json house/research-polls.json counties-watch/forecast-baselines.json research/senate-workbench-data.json source_snapshot.csv refresh_log.json recent_polls.json
              if git diff --staged --quiet; then exit 0; fi
              git commit -m 'Election Day verified publisher polling sweep and final forecast'
            }
            if git push origin HEAD:main; then
              echo 'Verified forecast datasets committed and Pages rebuild triggered'
              exit 0
            fi
          done
          echo 'Could not publish complete final sweep; existing data remains unchanged' >&2
          exit 1
