name: Refresh 2026 polling averages and poll archive
on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_polling.py'
      - 'scripts/build_county_watch_forecast.py'
      - 'scripts/recent_poll_parser.py'
      - 'research/curated_individual_polls_2026.json'
      - 'tests/test_recent_poll_parser.py'
      - '.github/workflows/refresh-polling.yml'
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: polling-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Test strict individual-poll extraction
        run: python -m unittest discover -s tests -p test_recent_poll_parser.py -v
      - name: Check verified general-election aggregates
        run: python scripts/refresh_polling.py
      - name: Refresh county watch model vote targets
        run: python scripts/build_county_watch_forecast.py
      - name: Validate and preserve audit
        run: python scripts/validate_data.py
      - name: Commit verified changes and refresh log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              # Recreate the audited polling data from the NEWEST archived research snapshot.
              # The public homepage is deliberately independent of polling refresh. Never rebase two generated data snapshots together.
              git reset --hard origin/main
              python scripts/refresh_polling.py
              python scripts/build_county_watch_forecast.py
              python scripts/validate_data.py
            fi
            git add research/senate-workbench-data.json source_snapshot.csv refresh_log.json recent_polls.json counties-watch/forecast-baselines.json
            if git diff --cached --quiet; then
              echo "No polling audit or source updates to publish"
              break
            fi
            git commit -m "Automatic 2026 Senate polling check"
            if git push origin HEAD:main; then
              echo "Polling update committed"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Polling update could not be published after retries" >&2
              exit 1
            fi
            sleep 3
          done
      # A push of generated snapshots to main automatically triggers the
      # single Pages publisher workflow. Do not deploy from this refresh job:
      # concurrent Pages deployments can conflict and fail despite valid data.
