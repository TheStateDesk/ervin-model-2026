name: Publish The State Desk news website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and audit the exact public artifact
        run: |
          python3 scripts/build-news-public.py
          python3 tests/newsroom_publication_audit.py
      - name: Install browser verification
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check desktop and mobile pages before publication
        run: node scripts/newsroom-smoke.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _news_public
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the exact live revision and every published file
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: python3 tests/newsroom_publication_audit.py --live
      - name: Check live desktop and mobile rendering
        env:
          SITE_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/newsroom-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newsroom-browser-checks
          path: newsroom-checks
          if-no-files-found: ignore
