name: Publish Ervin Model website
on:
  push:
    branches: [main]
    paths-ignore:
      - 'michigan/election-night/imports/*.csv'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate historical polling audit
        run: python3 scripts/validate_data.py
      - name: Install survey-parser test dependency
        run: python3 -m pip install beautifulsoup4
      - name: Validate geographic state data, survey parser and survey archive
        run: |
          node --check scripts/us-geography.js
          python -m json.tool recent_polls.json >/dev/null
          python -m py_compile scripts/refresh_polling.py scripts/recent_poll_parser.py
          python -m unittest discover -s tests -p test_recent_poll_parser.py -v
      - name: Validate governor election datasets and pages
        run: |
          python3 -c 'import json; from pathlib import Path; d=json.loads(Path("governors/data.json").read_text()); assert len(d["races"])==36; assert len({r["code"] for r in d["races"]})==36; assert sum(r["poll"] is not None for r in d["races"])==33; print("PASS: 36 distinct governor races, 33 attributed polling averages")'
          node --check governors/board.js
          node --check elections/app.js
      - name: Validate House district index and independent historical backtests
        run: |
          python3 -c 'import json;h=json.load(open("house/data.json"));seats=h["seats"];assert len(seats)==435 and len({x["id"] for x in seats})==435;assert len([x for x in seats if x["rating"]])==68;print("PASS: 435 House districts / 68 sourced ratings")'
          python3 scripts/audit_cross_office.py --check
          node --check house/board.js
          node --check elections/overview/center.js
      - name: Validate public homepage and stand-alone control script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('states/index.html').read_text()
          assert 'id="watchSection"' in h and 'id="electionDashboard"' in h and 'id="nationMap"' in h
          assert 'id="balanceOfPower"' in h
          assert h.index('id="watchSection"') < h.index('id="balanceOfPower"') < h.index('id="nationMap"')
          assert 'window.ERVIN_DATA' not in h and 'id="researchLab"' not in h
          assert '../scripts/home-election-2026.js' in h
          print('PASS public landing page: retired research UI absent')
          PY
          node --check scripts/home-control.js
          node --check scripts/home-election-2026.js
          node --check scripts/home-power.js
      - name: Test multi-cycle calibration and past-only backtest
        run: |
          node --check scripts/calibration_engine.js
          node --check scripts/senate_control.js
          node tests/test_senate_control.js
          node --check scripts/backtest_calibration.js
          node scripts/validate_calibration.js
          node scripts/backtest_calibration.js
      - name: Validate Counties to Watch datasets and JavaScript
        run: |
          node --check counties-watch/watch.js
          node --check counties-watch/source-desk.js
          python3 -m json.tool counties-watch/sources.json >/dev/null
          node --check counties-watch/metrics.js
          node --check counties-watch/benchmarks-ui.js
          node tests/test_watch_metrics.js
          python3 scripts/validate_watch_model.py
          python3 scripts/build_county_watch_forecast.py
          python3 -m json.tool counties-watch/history.json >/dev/null
          python3 -m json.tool counties-watch/results.json >/dev/null
          python3 -m json.tool counties-watch/sources.json >/dev/null
          python3 -m py_compile scripts/refresh_counties_watch.py
          python3 -m unittest discover -s tests -p test_counties_watch.py -v
      - name: Validate Michigan county baselines and frontend script
        run: |
          node --check michigan/dashboard.js
          node --check michigan/election-night/app.js
          node --check michigan/election-night/county-map-only.js
          node --check michigan/election-night/maps.js
          node --check michigan/election-night/clerk_watch_ui.js
          node --check michigan/election-night/county_live.js
          node --check michigan/election-night/precinct_outlook.js
          node --check michigan/election-night/precinct_model.js
          node --check site-chrome.js
          python3 -m unittest discover -s tests -p test_michigan_county_totals.py -v
          python3 -m unittest discover -s tests -p test_clerk_watch.py -v
          python3 -m json.tool michigan/election-night/results.json >/dev/null
          python3 -m unittest discover -s tests -p test_michigan_ingest.py -v
          python3 -c 'import json,pathlib; a=json.loads(pathlib.Path("michigan/county_history.json").read_text()); b=json.loads(pathlib.Path("michigan/counties.geojson").read_text()); c=a["counties"]; assert len(c)==len(b["features"])==83; assert sum(x["senate2024"]["d"] for x in c)==2712686; assert sum(x["senate2024"]["r"] for x in c)==2693680; assert sum(x["president2024"]["d"] for x in c)==2736533; assert sum(x["president2024"]["r"] for x in c)==2816636; assert len(set(x["name"] for x in c))==83; print("PASS: 83 complete counties, 2024 statewide returns and geometry")'
      - name: Browser smoke test (Chromium)
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER" || { echo "Chromium/Chrome unavailable"; exit 1; }
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ervin-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          timeout 55s "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-networking --no-first-run --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8765/tests/browser_smoke.html > /tmp/ervin-smoke.html 2>/tmp/ervin-chrome.err
          python3 -c 'from pathlib import Path; import re,sys; html=Path("/tmp/ervin-smoke.html").read_text(); m=re.search(r"<pre[^>]*data-status=\"(PASS|FAIL)\"[^>]*>(.*?)</pre>",html,re.S); print((re.sub(r"<[^>]+>","",m.group(2)) if m else "Missing browser result")[:4000]); sys.exit(0 if m and m.group(1)=="PASS" else 1)'
          timeout 85s "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-networking --no-first-run --virtual-time-budget=28000 --dump-dom http://127.0.0.1:8765/tests/michigan_smoke.html > /tmp/michigan-smoke.html 2>/tmp/michigan-chrome.err
          python3 -c 'from pathlib import Path; import re,sys; html=Path("/tmp/michigan-smoke.html").read_text(); m=re.search(r"<pre[^>]*data-status=\"(PASS|FAIL)\"[^>]*>(.*?)</pre>",html,re.S); print((re.sub(r"<[^>]+>","",m.group(2)) if m else "Missing Michigan browser result")[:4000]); sys.exit(0 if m and m.group(1)=="PASS" else 1)'
          timeout 55s "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-networking --no-first-run --virtual-time-budget=11000 --dump-dom http://127.0.0.1:8765/tests/michigan_election_night_smoke.html > /tmp/mi-night-smoke.html 2>/tmp/mi-night-chrome.err
          python3 -c 'from pathlib import Path; import re,sys; html=Path("/tmp/mi-night-smoke.html").read_text(); m=re.search(r"<pre[^>]*data-status=\"(PASS|FAIL)\"[^>]*>(.*?)</pre>",html,re.S); print((re.sub(r"<[^>]+>","",m.group(2)) if m else "Missing Michigan election-night result")[:4000]); sys.exit(0 if m and m.group(1)=="PASS" else 1)'
      - name: Counties to Watch browser smoke (Chromium)
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ervin-county-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 1
          timeout 50s "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-networking --no-first-run --virtual-time-budget=9000 --dump-dom http://127.0.0.1:8765/tests/counties_watch_smoke.html >/tmp/ervin-county-smoke.html 2>/tmp/ervin-county-chrome.err
          python3 -c 'from pathlib import Path;import re,sys;html=Path("/tmp/ervin-county-smoke.html").read_text();m=re.search(r"<pre[^>]*data-status=.(PASS|FAIL).[^>]*>(.*?)</pre>",html,re.S);print(re.sub(r"<[^>]*>","",m.group(2))[:4500] if m else "No county-watch browser result");sys.exit(0 if m and m.group(1)=="PASS" else 1)'
      - name: Governor board and election dossier browser regression (Chromium)
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ervin-elections-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 1
          timeout 65s "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-networking --no-first-run --virtual-time-budget=14000 --dump-dom http://127.0.0.1:8765/tests/election_dossier_smoke.html >/tmp/ervin-election-smoke.html 2>/tmp/ervin-election-chrome.err
          python3 -c 'from pathlib import Path;import re,sys;h=Path("/tmp/ervin-election-smoke.html").read_text();m=re.search(r"<pre[^>]*data-status=.(PASS|FAIL).[^>]*>(.*?)</pre>",h,re.S);print((re.sub(r"<[^>]*>","",m.group(2)) if m else "Missing election smoke result")[:5500]);sys.exit(0 if m and m.group(1)=="PASS" else 1)'
      - name: National House and Election Center browser regression (Chromium)
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ervin-center-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 1
          timeout 85s "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-networking --no-first-run --virtual-time-budget=24000 --dump-dom http://127.0.0.1:8765/tests/house_election_center_smoke.html >/tmp/ervin-center-smoke.html 2>/tmp/ervin-center-chrome.err
          python3 -c 'from pathlib import Path;import re,sys;h=Path("/tmp/ervin-center-smoke.html").read_text();m=re.search(r"<pre[^>]*data-status=.(PASS|FAIL).[^>]*>(.*?)</pre>",h,re.S);print((re.sub(r"<[^>]*>","",m.group(2)) if m else "Missing House/center browser result")[:8500]);sys.exit(0 if m and m.group(1)=="PASS" else 1)'
      - name: Appearance, contrast and theme preference browser regression (Chromium)
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ervin-theme-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          timeout 75s "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-networking --no-first-run --virtual-time-budget=19000 --dump-dom http://127.0.0.1:8765/tests/theme_smoke.html > /tmp/ervin-theme-smoke.html 2>/tmp/ervin-theme-chrome.err
          python3 -c 'from pathlib import Path; import re,sys; h=Path("/tmp/ervin-theme-smoke.html").read_text(); m=re.search(r"<pre[^>]*data-status=.(PASS|FAIL).[^>]*>(.*?)</pre>",h,re.S); print((re.sub(r"<[^>]*>","",m.group(2)) if m else "Missing theme smoke result")[:8000]); sys.exit(0 if m and m.group(1)=="PASS" else 1)'
      - name: Pre-publish state and county integrity
        run: |
          node scripts/validate-election-site.mjs
          node scripts/audit-internal-links.mjs
          node scripts/validate-state-desk.mjs
          node scripts/validate-house-forecast.mjs
          node scripts/validate-statewide-night.mjs
          node scripts/validate-forecast-backtests.mjs
          node scripts/test-election-night-balance.mjs
          node scripts/test-michigan-candidate-effect.mjs
          node scripts/validate-house-model.mjs
      - name: Pre-publish rendered screenshots and visual gate
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/visual-smoke.mjs
      - name: Upload pre-publish visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: prepublish-counties-and-darkmode
          path: visual-checks/
          retention-days: 14
      - name: Remove temporary browser test dependencies before Pages upload
        run: |
          rm -rf node_modules package-lock.json visual-checks
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published state pages in Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          node scripts/verify-live-publication.mjs
      - name: Preserve live-deployment screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-live-county-pages
          path: postdeploy-checks/
          retention-days: 14
