name: Publish The State Desk news website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build news-only publication
        run: |
          python3 -m py_compile scripts/build-news-public.py
          python3 scripts/build-news-public.py
          test -f _news_public/index.html
          test ! -d _news_public/archive
          test ! -d _news_public/results
          test ! -d _news_public/elections
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _news_public
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check public homepage and news sections
        run: |
          python3 - <<'PY'
          import urllib.request,time
          base='https://thestatedesk.github.io/'
          for path in ['', 'congress/', 'white-house/', 'states-news/', 'policy-economy/', 'analysis/']:
              url=base+path
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'TheStateDesk-PublicationAudit/1.0'}),timeout=20) as r:
                          page=r.read().decode('utf-8','replace')
                          assert r.status==200 and 'The State Desk' in page,(url,r.status)
                          print('LIVE OK',url)
                          break
                  except Exception:
                      if attempt==5: raise
                      time.sleep(15)
          PY
